# ---------- 功能 ----------
# 本地搜索（前端面板）
# 索引文件由站点插件 hexo-generator-searchdb 生成，主题不代劳：
#   npm i hexo-generator-searchdb
#   站点 _config.yml 里加：
#     search:
#       path: search.xml
#       field: post
#       content: true
# 主题这边只负责面板样式、快捷键和分页，下面 path 要与插件输出路径一致。
search:
  enable: true
  # 索引文件地址；前端按这个地址取，改这里要和插件的 path 一起改
  path: /search.xml
  # 搜索结果每页显示多少条（超过就分页，结果区不再出现滚动条）
  # 面板高度约 780px，建议 8 ~ 12 之间；填得太大仍会内部滚动
  page_size: 10

# RSS 订阅源（/atom.xml）由站点插件 hexo-generator-feed 生成，主题不代劳：
#   npm i hexo-generator-feed
# 装好后版权卡的「订阅」与页脚 RSS 图标即可用。

# ---------- 正文代码块 ----------
# 对应三件套：css/highlight.css + js/partial/code.js + 本节配置
# 外观是安知鱼 highlight_theme: mac 那一套（深色块 + 三颗窗口点 + 右上角复制）
code:
  # 右上角复制按钮
  copy: true
  # 左上角语言名（bash / js / yaml ...）
  lang: true
  # 顶部三颗红黄绿窗口点
  mac_style: true
  # 代码超过多少像素高时折叠，点底部按钮展开；填 0 表示不折叠
  height_limit: 420

# 说明：代码是否上色由站点 _config.yml 的 highlight.enable / syntax_highlighter 决定，
# 主题只负责把它画成什么样（上面 code 一节），这里不再重复开关。

# 说明：图片懒加载、平滑滚动在顶部 site_settings 里，不在这里重复。

# 控制台抽屉（仿 heoblog 的 console）
console:
  enable: true
  recent_count: 8
  keyboard_tips: true
